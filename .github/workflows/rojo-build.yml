
name: Rojo Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rojo
        uses: notthebestdev/setup-rojo@v1
        with:
          version: v7.5.1

      - name: Build Roblox project
        run: rojo build -o SkylineRush.rbxlx

      - name: Upload Roblox build
        uses: actions/upload-artifact@v6
        with:
          name: SkylineRush-place
          path: SkylineRush.rbxlx
          if-no-files-found: error

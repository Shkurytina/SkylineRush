
name: Rojo Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rojo
        uses: rojo-rbx/setup-rojo@v1
        with:
          version: 7.5.1

      - name: Build Roblox project
        run: rojo build -o SkylineRush.rbxlx

      - name: Upload Roblox build
        uses: actions/upload-artifact@v4
        with:
          name: SkylineRush-place
          path: SkylineRush.rbxlx
